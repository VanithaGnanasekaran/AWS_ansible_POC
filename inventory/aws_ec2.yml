plugin: amazon.aws.aws_ec2

regions:
  - ap-southeast-2

filters:
  instance-state-name: running

keyed_groups:
  - key: tags.Role
    prefix: role

compose:
  ansible_host: instance_id
  ansible_connection: amazon.aws.aws_ssm
  ansible_aws_ssm_region: ap-southeast-2
  ansible_aws_ssm_bucket_name: ansible-aws-demo
